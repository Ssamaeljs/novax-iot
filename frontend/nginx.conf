server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver del entorno Docker: vuelve a resolver si se recrea backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $novax_api http://backend:5000;

    location ^~ /v1/api/ {
        include /etc/nginx/novax-api-proxy.conf;
    }

    location = /api/health {
        include /etc/nginx/novax-api-proxy.conf;
    }

    location = /theme-init.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|ico|png|svg|webp|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.csr.html;
    }
}
